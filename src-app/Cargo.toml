[package]
name = "BJKS"
version = "3.2.0"
description = "本机快搜 - Windows 本地文件快速搜索工具（纯 CPU 软件渲染，无外部 DLL、无 GPU 依赖）"
authors = ["hanwu-git"]
edition = "2021"

[dependencies]
# 即时模式 GUI（0.34，不含默认嵌入字体：使用系统微软雅黑，减小体积）
egui = { version = "0.34", default-features = false }
egui_extras = { version = "0.34", default-features = false }
# CPU 软件渲染后端（vendored 本地副本 + 关闭拦截补丁，softbuffer 走系统 GDI，无需 GPU/OpenGL）
egui_software_backend = { path = "vendor/egui_software_backend", features = ["rayon"] }
# 系统托盘
tray-icon = "0.19"
# 原生文件夹选择对话框（目录范围筛选）
rfd = "0.15"
# 图标加载（窗口/托盘 ico）
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
# 本地时间格式化、系统文件图标（Shell/Gdi）、失败提示框
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Time", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
rayon = "1"
walkdir = "2"
dirs = "5"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"          # 主逻辑体积优先
lto = true               # 链接时优化
codegen-units = 1
panic = "abort"
strip = true

# 软件光栅化热路径保持高优化，避免界面滚动卡顿
[profile.release.package.egui]
opt-level = 3
[profile.release.package.epaint]
opt-level = 3
[profile.release.package.egui_extras]
opt-level = 3
[profile.release.package.egui_software_backend]
opt-level = 3
[profile.release.package.softbuffer]
opt-level = 3
